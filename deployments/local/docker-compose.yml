version: "3.9"

services:
  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_BROKER_ID=0

  postgres:
    image: postgres:16-alpine
    env_file: [../../.env.example]
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7.0
    env_file: [../../.env.example]
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db

  # Backend Services
  orchestration-service:
    build:
      context: ../../
      dockerfile: services/orchestration-service/Dockerfile
    env_file: [../../.env.example]
    depends_on: [kafka, postgres, mongo]

  tool-execution-service:
    build:
      context: ../../
      dockerfile: services/tool-execution-service/Dockerfile
    env_file: [../../.env.example]
    depends_on: [kafka]
    deploy: # Allows for easy scaling of workers
      replicas: 3

  data-processing-service:
    build:
      context: ../../
      dockerfile: services/data-processing-service/Dockerfile
    env_file: [../../.env.example]
    depends_on: [kafka, mongo]

  persistence-service:
    build:
      context: ../../
      dockerfile: services/persistence-service/Dockerfile
    env_file: [../../.env.example]
    depends_on: [postgres, mongo]

  api-gateway:
    build:
      context: ../../
      dockerfile: services/api-gateway/Dockerfile
    env_file: [../../.env.example]
    ports: ["8080:8080"]
    depends_on: [orchestration-service]

volumes:
  postgres_data:
  mongo_data:
