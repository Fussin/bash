[tool.poetry]
name = "api-gateway"
version = "0.1.0"
description = "The API Gateway for Project Chimera."
authors = ["Jules <jules@example.com>"]
readme = "README.md"
packages = [{include = "api_gateway", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
httpx = "^0.27.0" # For making async requests to other services

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
