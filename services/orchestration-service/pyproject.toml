[tool.poetry]
name = "orchestration-service"
version = "0.1.0"
description = "The Orchestration Service for Project Chimera."
authors = ["Jules <jules@example.com>"]
readme = "README.md"
packages = [{include = "orchestration_service", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
# MCP Client dependencies
fastmcp = ">=0.2.0,<1.0.0"
requests = ">=2.31.0,<3.0.0"

# Add other dependencies like kafka-python, sqlalchemy etc. here

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
