[tool.poetry]
name = "tool-execution-service"
version = "0.1.0"
description = "The Tool Execution Service for Project Chimera. Runs the HexStrike server."
authors = ["Jules <jules@example.com>"]
readme = "README.md"
packages = [{include = "tool_execution_service", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
# Core Framework
flask = ">=2.3.0,<4.0.0"
requests = ">=2.31.0,<3.0.0"
psutil = ">=5.9.0,<6.0.0"
fastmcp = ">=0.2.0,<1.0.0"
# Web Scraping & Automation
beautifulsoup4 = ">=4.12.0,<5.0.0"
selenium = ">=4.15.0,<5.0.0"
webdriver-manager = ">=4.0.0,<5.0.0"
# Async & Networking
aiohttp = ">=3.8.0,<4.0.0"
# Proxy & Testing
mitmproxy = ">=9.0.0,<11.0.0"
# Binary Analysis
pwntools = ">=4.10.0,<5.0.0"
angr = ">=9.2.0,<10.0.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
